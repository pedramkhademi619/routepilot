[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routepilot"
version = "0.1.0"
description = "Production-grade Linux desktop utility for selective VPN bypass and traffic policy routing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "RoutePilot Contributors", email = "maintainers@routepilot.local" }
]
keywords = [
    "linux",
    "networking",
    "vpn",
    "bypass",
    "split-tunneling",
    "nftables",
    "policy-routing",
    "pyqt6",
    "networkmanager"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Firewalls"
]

dependencies = [
    "PyQt6>=6.6.0",
    "pydantic>=2.5.0",
    "dbus-fast>=2.20.0",
    "pyroute2>=0.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[project.scripts]
routepilot = "routepilot.cli.main:main"
routepilot-gui = "routepilot.ui.app:main"
routepilot-serviced = "routepilot.service.daemon:main"
routepilot-recover = "routepilot.cli.recover:main"

[tool.hatch.build.targets.wheel]
packages = ["src/routepilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
exclude = ["\\.venv", ".*site-packages.*"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "pyroute2.*",
    "dbus_fast.*",
    "PyQt6.*"
]
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
