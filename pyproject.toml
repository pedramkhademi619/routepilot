[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "routepilot"
dynamic = ["version"]
description = "Split tunneling for Linux desktops: send chosen domains and IP ranges around (or through) your VPN"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "pedramkhademi619" }]
keywords = [
    "linux",
    "vpn",
    "split-tunneling",
    "vpn-bypass",
    "policy-routing",
    "nftables",
    "networkmanager",
    "pyqt6",
    "routing",
    "split-dns",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Natural Language :: Persian",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Firewalls",
    "Typing :: Typed",
]
dependencies = [
    "PyQt6>=6.6.0",
    "pydantic>=2.5.0",
    "dbus-fast>=2.20.0",
    "pyroute2>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/pedramkhademi619/routepilot"
Repository = "https://github.com/pedramkhademi619/routepilot"
Issues = "https://github.com/pedramkhademi619/routepilot/issues"
Changelog = "https://github.com/pedramkhademi619/routepilot/blob/main/CHANGELOG.md"

[project.scripts]
routepilot = "routepilot.cli.main:main"
routepilot-apply = "routepilot.cli.apply:main"
routepilot-recover = "routepilot.cli.recover:main"

[project.gui-scripts]
routepilot-gui = "routepilot.ui.app:main"

[tool.hatch.version]
path = "src/routepilot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/routepilot"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "packaging", "scripts", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
exclude = ["\\.venv", ".*site-packages.*"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyroute2.*", "dbus_fast.*"]
ignore_missing_imports = true

# PyQt6's bundled stubs change incompatibly between patch releases (e.g. 6.12.0 -> 6.12.1),
# so Qt types are treated as Any; our own code is still checked strictly.
[[tool.mypy.overrides]]
module = ["PyQt6.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
